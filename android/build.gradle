buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

def localBuildRoot = System.getenv("COBTRAVELS_ANDROID_BUILD_DIR") ?: new File(System.getProperty("user.home"), ".gradle\\cobtravels-build")
subprojects {
    buildDir = new File(localBuildRoot, name)
}

apply plugin: "com.facebook.react.rootproject"
